[project]
name = "constellation"
version = "0.1.0"
description = "A control room for all your Claude Code sessions."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "fastapi>=0.162.0",
    "psutil>=7.0.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
constellation = "constellation.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/constellation"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
